[package]
name = "srun-portal"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Clean-room Rust implementation of the Srun portal client protocol (portal-core@1.9.15)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lingdiansr/srun-portal"
readme = "README.md"

[dependencies]
directories = "6"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
same-file = "1"
ureq = "2"
ctrlc = { version = "3.5", features = ["termination"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(target_os = \"macos\")".dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"
