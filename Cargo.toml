[package]
name = "srun-portal"
version = "0.1.0"
edition = "2021"
description = "Clean-room Rust implementation of the Srun portal client protocol (portal-core@1.9.15)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/lingdiansr/srun-portal"
readme = "README.md"

[dependencies]
directories = "6"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
serde_json = "1"
toml = "0.9"
ureq = "2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Security_Credentials", "Win32_System_Console"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
